[project]
name = "remnote-pronunciation-server"
version = "0.1.0"
description = "Small edge-tts server for the RemNote Pronunciation plugin"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
